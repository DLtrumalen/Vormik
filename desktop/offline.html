<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vormik</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #eef2f8;
        font-family: "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      .logo {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #0072ce;
        font-size: 36px;
      }
      p {
        color: #8a97ad;
        max-width: 320px;
        margin: 8px auto 24px;
        line-height: 1.5;
      }
      button {
        height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 14px;
        background: #4c9dff;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">õ</div>
      <h1 id="title">Нет подключения к интернету</h1>
      <p id="text">
        При первом запуске Vormik нужен интернет. Потом приложение работает и без него.
      </p>
      <button id="retry" type="button">Повторить</button>
    </main>
    <script>
      const texts = {
        en: [
          "No internet connection",
          "Vormik needs the internet on first launch. After that it works offline.",
          "Retry",
        ],
        fi: [
          "Ei internetyhteyttä",
          "Vormik tarvitsee internetin ensimmäisellä käynnistyskerralla. Sen jälkeen se toimii ilman verkkoa.",
          "Yritä uudelleen",
        ],
      };
      const lang = (navigator.language || "ru").slice(0, 2);
      if (texts[lang]) {
        const [title, text, retry] = texts[lang];
        document.documentElement.lang = lang;
        document.getElementById("title").textContent = title;
        document.getElementById("text").textContent = text;
        document.getElementById("retry").textContent = retry;
      }
      const target =
        new URLSearchParams(location.search).get("url") || "https://vormik.vercel.app/train";
      document.getElementById("retry").addEventListener("click", () => location.replace(target));
    </script>
  </body>
</html>
